name: Space Keep Alive

on:
  schedule:
    # 30-hour intervals across the week (HF Space sleeps after 48h of inactivity):
    - cron: "0 0 * * 0"   # Sun 00:00 UTC
    - cron: "0 6 * * 1"   # Mon 06:00 UTC (+30h)
    - cron: "0 12 * * 2"  # Tue 12:00 UTC (+30h)
    - cron: "0 18 * * 3"  # Wed 18:00 UTC (+30h)
    - cron: "0 0 * * 5"   # Fri 00:00 UTC (+30h)
    - cron: "0 6 * * 6"   # Sat 06:00 UTC (+30h)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          TARGET_URL="${{ secrets.HF_SPACE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://idkhowtocodefr-hf-backend.hf.space/health"
          fi

          echo "Sending keep-alive ping to ${TARGET_URL}..."
          curl --fail --show-error --silent --max-time 30 "$TARGET_URL" || exit 1
          echo "Keep-alive ping successful."
